<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studlike — Sem conexão</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F0F2F5;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: #0f172a;
    }
    .card {
      background: #fff;
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 22rem;
      width: 100%;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
    }
    .badge {
      display: inline-block;
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      margin-bottom: 0.625rem;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #1877F2;
      color: #fff;
      border: none;
      border-radius: 0.75rem;
      padding: 0.625rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: #1B74E4; }
    .hint {
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Studlike</span>
    <h1>Sem conexão</h1>
    <p>
      Não foi possível carregar o app.<br />
      Verifique sua internet e tente novamente.
    </p>
    <button class="btn" onclick="window.location.reload()">
      ↺ Tentar novamente
    </button>
    <p class="hint">
      Dica: abra o app online pelo menos duas vezes<br />
      para ativar o modo offline completo.
    </p>
  </div>
</body>
</html>
